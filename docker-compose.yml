# Local AWS emulation for development. See docs/guides/local-development.md.
# Pinned tag (not :latest) for reproducibility — bump deliberately.
services:
  localstack:
    image: localstack/localstack:2026.05.1
    container_name: time-tracking-app-localstack
    ports:
      - '4566:4566' # single edge port for all emulated AWS services
    environment:
      # Required to activate the image's license; sourced from .env.localstack via the Makefile.
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      # ssm + ecr: `cdk bootstrap`; logs: Lambda runtime; apigateway: the REST API front;
      # route53: API Gateway CreateDomainName looks up hosted zones (custom domain).
      - SERVICES=s3,sqs,lambda,dynamodb,cloudformation,iam,sts,ssm,ecr,logs,apigateway,route53
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT=60
      # Attach spawned Lambda containers to this compose network so they share stable
      # service-name DNS with LocalStack regardless of the working-directory name.
      - LAMBDA_DOCKER_NETWORK=time-tracking-app
    volumes:
      # Lambda runs in Docker — LocalStack needs the host socket to spawn runtime containers.
      - '/var/run/docker.sock:/var/run/docker.sock'
      # Mount the repo at its host path so Lambda hot-reload (S3Key = host abs path) resolves.
      - '${PWD}:${PWD}'

  # Local edge: maps the stageless `*.timetracker.test` hosts to the dev server
  # (live → :4321) and the deployed API Gateway stage (staged → /prod). Lets the
  # browser use root-absolute asset/nav links unchanged. Devs point both hosts at
  # 127.0.0.1 in /etc/hosts. See docs/guides/local-development.md.
  nginx:
    image: nginx:1.29-alpine
    container_name: time-tracking-app-nginx
    ports:
      - '80:80'
    volumes:
      - './nginx/timetracker.conf:/etc/nginx/conf.d/default.conf:ro'
    extra_hosts:
      # Reach the host's Astro dev server (:4321) from inside the container.
      - 'host.docker.internal:host-gateway'
    depends_on:
      - localstack

# Named so LAMBDA_DOCKER_NETWORK (above) and service-name DNS are stable regardless of dir name.
networks:
  default:
    name: time-tracking-app
