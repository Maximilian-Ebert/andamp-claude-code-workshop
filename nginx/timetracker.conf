map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Live: the Astro dev server (HMR) running on the host at :4321.
server {
  listen 80;
  server_name live.timetracker.test;

  location / {
    proxy_pass http://host.docker.internal:4321;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# Staged: the deployed stack behind API Gateway. The browser sees a stageless
# root host; nginx maps it onto LocalStack's path-based invoke endpoint for the
# pinned API id + `prod` stage. Routing is by path (not Host), so the original
# Host passes through unchanged — Astro's same-origin check on form POSTs holds.
server {
  listen 80;
  server_name staged.timetracker.test;

  location / {
    proxy_pass http://localstack:4566/restapis/timetracker/prod/_user_request_/;
    proxy_set_header Host $host;
  }
}
